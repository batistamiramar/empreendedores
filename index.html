<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quadro de Empreendedores</title>

  <meta
    name="description"
    content="Encontre produtos e serviços oferecidos por pessoas da nossa comunidade."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --bg: #16323E;
      --bg-deep: #0F262F;
      --card: #FBF7EE;
      --card-edge: #EFE7D3;
      --ink: #1C2B2E;
      --ink-soft: #566769;
      --gold: #D2A24C;
      --gold-deep: #B98531;
      --green: #4C7A5D;
      --brick: #A85B3F;
      --paper-line: rgba(28, 43, 46, 0.09);
      --white-soft: rgba(251, 247, 238, 0.72);
      --shadow: 0 18px 44px -22px rgba(0,0,0,.65);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(circle at 15% 5%, rgba(210,162,76,.10), transparent 32%),
        radial-gradient(circle at 90% 0%, rgba(76,122,93,.12), transparent 38%),
        var(--bg);

      color: var(--ink);
      font-family: "Inter", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================================================
       CABEÇALHO
    ========================================================= */

    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 42px 24px 22px;
      text-align: center;
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: .19em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;

      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: clamp(37px, 6vw, 63px);
      letter-spacing: -.025em;

      color: var(--card);
    }

    .subtitle {
      max-width: 650px;
      margin: 14px auto 0;

      color: rgba(251,247,238,.67);
      line-height: 1.6;
      font-size: 15px;
    }

    .header-actions {
      margin-top: 22px;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .outline-btn,
    .gold-btn {
      min-height: 40px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      border-radius: 999px;
      padding: 9px 16px;

      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;

      transition: .18s ease;
    }

    .outline-btn {
      color: var(--gold);
      background: rgba(210,162,76,.07);
      border: 1px solid rgba(210,162,76,.4);
    }

    .outline-btn:hover {
      background: var(--gold);
      color: var(--bg-deep);
    }

    .gold-btn {
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--bg-deep);
      font-weight: 700;
    }

    .gold-btn:hover {
      transform: translateY(-1px);
      background: #E2B55C;
    }

    .outline-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    #refreshBtn svg {
      transition: transform .45s ease;
    }

    #refreshBtn.spinning svg {
      transform: rotate(360deg);
    }

    /* =========================================================
       PAINEL DE BUSCA
    ========================================================= */

    .catalog-panel {
      max-width: 1000px;
      margin: 18px auto 0;
      padding: 0 24px;
    }

    .search-wrap {
      background: var(--card);
      border: 1px solid var(--card-edge);
      border-radius: 16px;

      min-height: 65px;

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 7px 16px 7px 20px;

      box-shadow: var(--shadow);
    }

    .search-wrap svg {
      color: var(--ink-soft);
      flex: 0 0 auto;
    }

    #searchInput {
      width: 100%;

      border: none;
      outline: none;
      background: transparent;

      font-size: 16px;
      color: var(--ink);

      padding: 13px 0;
    }

    #searchInput::placeholder {
      color: #9BA6A5;
    }

    .filter-row {
      margin-top: 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }

    .chip {
      border-radius: 999px;

      border: 1px solid rgba(251,247,238,.17);
      background: rgba(251,247,238,.06);

      color: rgba(251,247,238,.84);

      font-family: "JetBrains Mono", monospace;
      font-size: 11px;

      padding: 8px 13px;

      transition: .15s ease;
    }

    .chip:hover {
      border-color: var(--gold);
    }

    .chip.active {
      color: var(--bg-deep);
      background: var(--gold);
      border-color: var(--gold);
      font-weight: 700;
    }

    .sort-wrap {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sort-wrap label {
      font-size: 11px;
      font-family: "JetBrains Mono", monospace;
      color: rgba(251,247,238,.52);
    }

    #sortSelect,
    #mobileCategory {
      background: rgba(251,247,238,.08);
      color: var(--card);

      border: 1px solid rgba(251,247,238,.18);
      border-radius: 999px;

      outline: none;

      padding: 8px 11px;

      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
    }

    #sortSelect option,
    #mobileCategory option {
      background: var(--bg-deep);
      color: white;
    }

    #mobileCategoryWrap {
      display: none;
    }

    .status-line {
      min-height: 21px;

      margin: 18px auto 0;
      text-align: center;

      color: rgba(251,247,238,.48);

      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
    }

    .error-message {
      max-width: 680px;
      margin: 14px auto 0;

      background: rgba(168,91,63,.15);
      border: 1px solid rgba(168,91,63,.42);

      color: #F5DDD2;

      padding: 11px 14px;

      border-radius: 10px;

      font-size: 12px;
      text-align: center;

      display: none;
    }

    /* =========================================================
       GRID
    ========================================================= */

    main {
      max-width: 1160px;

      margin: 34px auto 0;
      padding: 0 24px 70px;

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-edge);

      border-radius: 16px;

      position: relative;

      padding: 21px;

      box-shadow: 0 15px 34px -20px rgba(0,0,0,.65);

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 23px 44px -20px rgba(0,0,0,.65);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .business-logo {
      width: 62px;
      height: 62px;

      flex: 0 0 62px;

      border-radius: 15px;

      background: #EEE8DB;
      border: 1px solid #E3DAC8;

      object-fit: cover;
    }

    .business-logo.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Fraunces", serif;
      font-size: 24px;
      font-weight: 700;

      color: var(--gold-deep);
    }

    .business-heading {
      min-width: 0;
      flex: 1;
    }

    .business-name-line {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .business-heading h3 {
      margin: 0;

      font-family: "Fraunces", serif;
      font-weight: 600;

      color: var(--ink);
      font-size: 22px;

      line-height: 1.15;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      gap: 4px;

      padding: 3px 7px;

      border-radius: 999px;

      font-family: "JetBrains Mono", monospace;
      font-size: 9px;
      text-transform: uppercase;

      color: var(--green);
      background: rgba(76,122,93,.11);
      border: 1px solid rgba(76,122,93,.22);
    }

    .service-name {
      margin-top: 5px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;

      margin-top: 14px;
    }

    .tag {
      padding: 5px 8px;
      border-radius: 999px;

      background: rgba(210,162,76,.12);
      border: 1px solid rgba(210,162,76,.23);

      color: #86611F;

      font-family: "JetBrains Mono", monospace;
      font-size: 9.5px;
      text-transform: uppercase;
    }

    .description {
      margin: 14px 0 0;

      color: var(--ink-soft);
      font-size: 13px;
      line-height: 1.55;
    }

    .details {
      margin-top: 15px;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;

      border-top: 1px dashed var(--paper-line);

      padding: 9px 0;

      color: var(--ink-soft);
      font-size: 12.5px;

      line-height: 1.45;
    }

    .info-row svg {
      flex: 0 0 auto;
      margin-top: 1px;
      color: var(--gold-deep);
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;

      margin-top: 15px;
    }

    .card-btn {
      min-height: 39px;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;

      border-radius: 10px;

      font-size: 11px;
      font-weight: 600;

      transition: .15s ease;

      border: 1px solid #DDD5C6;
      background: #F7F1E5;
      color: var(--ink);
    }

    .card-btn:hover {
      transform: translateY(-1px);
      border-color: var(--gold);
    }

    .card-btn.whatsapp {
      background: rgba(76,122,93,.11);
      border-color: rgba(76,122,93,.28);
      color: #365B43;
    }

    .card-btn.details-btn {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .card-btn.full {
      grid-column: 1 / -1;
    }

    .empty {
      grid-column: 1 / -1;

      color: rgba(251,247,238,.65);
      text-align: center;

      padding: 70px 20px;

      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
    }

    /* =========================================================
       SKELETON
    ========================================================= */

    .skeleton {
      pointer-events: none;
      overflow: hidden;
    }

    .skeleton-line,
    .skeleton-logo {
      background:
        linear-gradient(
          90deg,
          #E9E1D3 20%,
          #F4EEE4 40%,
          #E9E1D3 60%
        );

      background-size: 200% 100%;

      animation: shimmer 1.2s infinite;
    }

    .skeleton-logo {
      width: 62px;
      height: 62px;
      border-radius: 15px;
    }

    .skeleton-line {
      height: 12px;
      border-radius: 999px;
      margin-top: 10px;
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    /* =========================================================
       MODAL
    ========================================================= */

    .modal-overlay {
      position: fixed;
      inset: 0;

      z-index: 9999;

      background: rgba(8,22,28,.82);
      backdrop-filter: blur(8px);

      display: none;
      align-items: center;
      justify-content: center;

      padding: 22px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: min(640px, 100%);
      max-height: 90vh;
      overflow-y: auto;

      position: relative;

      background: var(--card);
      border-radius: 19px;
      border: 1px solid var(--card-edge);

      padding: 27px;

      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }

    .close-modal {
      position: absolute;
      top: 14px;
      right: 14px;

      width: 37px;
      height: 37px;

      border: none;
      border-radius: 50%;

      background: rgba(28,43,46,.08);
      color: var(--ink);

      font-size: 19px;
    }

    .modal h2 {
      margin: 0;
      padding-right: 42px;

      font-family: "Fraunces", serif;
      font-size: 30px;
    }

    .modal-description {
      margin-top: 13px;

      color: var(--ink-soft);
      line-height: 1.6;
    }

    .modal-section {
      margin-top: 22px;
    }

    .modal-section-title {
      margin-bottom: 8px;

      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;

      color: var(--gold-deep);
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;

      margin-top: 20px;
    }

    .modal-actions a {
      border-radius: 10px;

      padding: 10px 13px;

      font-size: 12px;
      font-weight: 600;

      border: 1px solid #DCD3C4;
      background: #F6EFE3;
    }

    .modal-actions a.whatsapp {
      background: rgba(76,122,93,.12);
      border-color: rgba(76,122,93,.28);
      color: #365B43;
    }

    footer {
      text-align: center;
      color: rgba(251,247,238,.34);

      padding: 0 20px 38px;

      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
    }

    /* =========================================================
       RESPONSIVO
    ========================================================= */

    @media (max-width: 720px) {
      header {
        padding-top: 34px;
      }

      .chips {
        display: none;
      }

      #mobileCategoryWrap {
        display: block;
        flex: 1;
      }

      #mobileCategory {
        width: 100%;
      }

      .filter-row {
        align-items: stretch;
      }

      .sort-wrap {
        flex: 1;
      }

      #sortSelect {
        width: 100%;
      }

      main {
        grid-template-columns: 1fr;
      }

      .card-actions {
        grid-template-columns: 1fr;
      }

      .card-btn.full {
        grid-column: auto;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 14px;
      }

      .search-wrap {
        min-height: 58px;
      }

      .business-logo,
      .skeleton-logo {
        width: 55px;
        height: 55px;
        flex-basis: 55px;
      }
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
  </style>
</head>

<body>

<header>
  <div class="eyebrow">
    Comunidade · Serviços · Confiança
  </div>

  <h1>
    Quadro de Empreendedores
  </h1>

  <p class="subtitle">
    Encontre produtos e serviços oferecidos por pessoas da nossa comunidade.
    Pesquise, conheça e fortaleça os empreendedores que caminham conosco.
  </p>

  <div class="header-actions">
    <button
      id="refreshBtn"
      class="outline-btn"
      type="button"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.5 9a9 9 0 0 1 14.8-3.4L23 10"></path>
        <path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"></path>
      </svg>

      Atualizar
    </button>

    <a
      id="registerBtn"
      class="gold-btn"
      href="#"
      target="_blank"
      rel="noopener"
      style="display:none;"
    >
      + Cadastrar meu negócio
    </a>
  </div>
</header>


<section class="catalog-panel">

  <div class="search-wrap">

    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.7" y2="16.7"></line>
    </svg>

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Buscar por nome, profissão, produto ou serviço..."
    >

  </div>


  <div class="filter-row">

    <div
      class="chips"
      id="chips"
    ></div>


    <div id="mobileCategoryWrap">
      <select
        id="mobileCategory"
        aria-label="Filtrar por categoria"
      >
        <option value="">
          Todas as categorias
        </option>
      </select>
    </div>


    <div class="sort-wrap">

      <label for="sortSelect">
        Ordenar:
      </label>

      <select id="sortSelect">

        <option value="az">
          A–Z
        </option>

        <option value="za">
          Z–A
        </option>

        <option value="category">
          Categoria
        </option>

        <option value="recent">
          Mais recentes
        </option>

      </select>

    </div>

  </div>


  <div
    class="status-line"
    id="statusLine"
  ></div>


  <div
    class="error-message"
    id="errorMessage"
  ></div>

</section>


<main id="grid"></main>


<footer>
  Quadro de Empreendedores — feito com carinho pela comunidade
</footer>


<div
  class="modal-overlay"
  id="modalOverlay"
  aria-hidden="true"
>

  <div
    class="modal"
    role="dialog"
    aria-modal="true"
  >

    <button
      class="close-modal"
      id="closeModal"
      aria-label="Fechar"
    >
      ×
    </button>

    <div id="modalContent"></div>

  </div>

</div>


<script>

  /* ===========================================================
     CONFIGURAÇÃO
  =========================================================== */

  const SHEET_CSV_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vS1bS5dffDMngpDZTqD7yZpzdsHpCNmh-L9vKBfVd-x6451GihNC4WCFwrIQ54sQoqC-oObH8TzOJXY/pub?gid=0&single=true&output=csv";


  /*
    Depois que você criar o Google Forms,
    cole o link abaixo.

    Exemplo:
    const CADASTRO_FORM_URL =
      "https://forms.gle/xxxxxxxx";

    Enquanto estiver vazio,
    o botão de cadastro fica oculto.
  */

  const CADASTRO_FORM_URL = "";


  const CACHE_KEY =
    "batista_miramar_empreendedores_v3";


  /* ===========================================================
     ELEMENTOS
  =========================================================== */

  const grid =
    document.getElementById("grid");

  const searchInput =
    document.getElementById("searchInput");

  const chipsEl =
    document.getElementById("chips");

  const mobileCategory =
    document.getElementById("mobileCategory");

  const sortSelect =
    document.getElementById("sortSelect");

  const statusLine =
    document.getElementById("statusLine");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const errorMessage =
    document.getElementById("errorMessage");

  const registerBtn =
    document.getElementById("registerBtn");

  const modalOverlay =
    document.getElementById("modalOverlay");

  const modalContent =
    document.getElementById("modalContent");

  const closeModal =
    document.getElementById("closeModal");


  /* ===========================================================
     ESTADO
  =========================================================== */

  let empreendedores = [];

  let activeCategory = "";

  let lastSuccessfulUpdate = null;


  /* ===========================================================
     FORMULÁRIO
  =========================================================== */

  if (
    CADASTRO_FORM_URL &&
    CADASTRO_FORM_URL.startsWith("http")
  ) {

    registerBtn.href =
      CADASTRO_FORM_URL;

    registerBtn.style.display =
      "inline-flex";

  }


  /* ===========================================================
     UTILITÁRIOS
  =========================================================== */

  function norm(value) {

    return (value || "")
      .toString()
      .normalize("NFD")
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase()
      .trim();

  }


  function safeText(value) {

    return (value || "")
      .toString()
      .trim();

  }


  function normalizePhone(value) {

    let digits =
      safeText(value)
        .replace(/\D/g, "");


    /*
      Se o número brasileiro estiver
      sem código do país,
      adicionamos 55.
    */

    if (
      digits.length >= 10 &&
      digits.length <= 11
    ) {

      digits =
        "55" + digits;

    }


    return digits;

  }


  function isTruthy(value) {

    const text =
      norm(value);


    return [
      "sim",
      "s",
      "true",
      "1",
      "yes"
    ].includes(
      text
    );

  }


  function splitCategories(value) {

    return safeText(value)
      .split(/[,;|]/)
      .map(
        item =>
          item.trim()
      )
      .filter(Boolean);

  }


  function getInitials(name) {

    const words =
      safeText(name)
        .split(/\s+/)
        .filter(Boolean);


    return words
      .slice(0, 2)
      .map(
        word =>
          word.charAt(0)
      )
      .join("")
      .toUpperCase();

  }


  function instagramUrl(value) {

    const text =
      safeText(value);


    if (!text) {
      return "";
    }


    if (
      text.startsWith("http://") ||
      text.startsWith("https://")
    ) {

      return text;

    }


    return (
      "https://instagram.com/" +
      text.replace(
        /^@/,
        ""
      )
    );

  }


  function websiteUrl(value) {

    const text =
      safeText(value);


    if (!text) {
      return "";
    }


    if (
      text.startsWith("http://") ||
      text.startsWith("https://")
    ) {

      return text;

    }


    return (
      "https://" +
      text
    );

  }


  function mapsUrl(item) {

    if (
      item.mapa &&
      item.mapa.startsWith("http")
    ) {

      return item.mapa;

    }


    if (!item.endereco) {
      return "";
    }


    return (
      "https://www.google.com/maps/search/?api=1&query=" +
      encodeURIComponent(
        item.endereco
      )
    );

  }


  function whatsappUrl(item) {

    const phone =
      normalizePhone(
        item.whatsapp ||
        item.telefone
      );


    if (!phone) {
      return "";
    }


    const message =
      `Olá! Encontrei ${
        item.nome
      } no Quadro de Empreendedores da Igreja Batista Miramar e gostaria de mais informações.`;


    return (
      `https://wa.me/${phone}?text=` +
      encodeURIComponent(
        message
      )
    );

  }

        CACHE_KEY,
        JSON.stringify({
          timestamp:
            Date.now(),

          data:
            empreendedores
        })
      );

    }

    catch (error) {

      console.warn(
        "Não foi possível salvar o cache:",

      );

  function loadCache() {

    try {

      const stored =
        localStorage.getItem(
          CACHE_KEY
        );


      if (!stored) {
        return false;
      }


      const parsed =
        JSON.parse(
          stored
        );


      if (
        !parsed ||
        !Array.isArray(
          parsed.data
        ) ||
        parsed.data.length === 0
      ) {

        return false;

      }


      empreendedores =
        parsed.data;


      lastSuccessfulUpdate =
        parsed.timestamp ||
        null;


      return true;

    }

    catch (error) {

      return false;

    }

  }

  function parseRowsFromSheet(rows) {

    return rows
      .map(
        (row, index) => {

          function getValue(keys) {

            for (
              const key of keys
            ) {

              const column =
                Object.keys(row)
                  .find(
                    current =>
                      norm(current) ===
                      norm(key)
                  );


              if (
                column &&
                row[column] !==
                  undefined &&
                row[column] !==
                  null
              ) {

                return safeText(
                  row[column]
                );

              }

            }


            return "";

          }


          const principalService =
            getValue([
              "Servico",
              "Serviço"
            ]);


          let categorias =
            splitCategories(
              getValue([
                "Categorias",
                "Categoria"
              ])
            );


          if (
            principalService &&
            !categorias.some(
              category =>
                norm(category) ===
                norm(principalService)
            )
          ) {

            categorias.unshift(
              principalService
            );

          }


          return {

            id:
              index + 1,

            nome:
              getValue([
                "Nome"
              ]),

            servico:
              principalService,

            categorias:
              categorias,

            telefone:
              getValue([
                "Telefone"
              ]),

            whatsapp:
              getValue([
                "Whatsapp",
                "WhatsApp"
              ]),

            endereco:
              getValue([
                "Endereco",
                "Endereço"
              ]),

            descricao:
              getValue([
                "Descricao",
                "Descrição"
              ]),

            instagram:
              getValue([
                "Instagram"
              ]),

            site:
              getValue([
                "Site",
                "Website"
              ]),

            horario:
              getValue([
                "Horario",
                "Horário",
                "Horario de atendimento",
                "Horário de atendimento"
              ]),

            logo:
              getValue([
                "Logo",
                "Imagem",
                "Foto"
              ]),

            mapa:
              getValue([
                "Mapa",
                "Google Maps"
              ]),

            verificado:
              isTruthy(
                getValue([
                  "Verificado"
                ])
              ),

            dataCadastro:
              getValue([
                "Data",
                "Data Cadastro",
                "Data de Cadastro"
              ])

          };

        }
      )

      .filter(
        item =>
          item.nome
      );

  }

  function allCategories() {

    const categories =
      new Map();


    empreendedores
      .flatMap(
        item =>
          item.categorias || []
      )
      .forEach(
        category => {

          const key =
            norm(category);


          if (
            key &&
            !categories.has(key)
          ) {

            categories.set(
              key,
              category
            );

          }

        }
      );


    return [
      ...categories.values()
    ].sort(
      (a, b) =>
        a.localeCompare(
          b,
          "pt-BR"
        )
    );

  }

  function getFilteredItems() {

    const query =
      norm(
        searchInput.value
      );


    let result =
      empreendedores.filter(
        item => {

          const searchable =
            [
              item.nome,
              item.servico,
              item.telefone,
              item.endereco,
              item.descricao,
              item.instagram,
              ...(item.categorias || [])
            ]
            .map(norm)
            .join(" ");


          const queryMatch =
            !query ||
            searchable.includes(
              query
            );


          const categoryMatch =
            !activeCategory ||
            (
              item.categorias || []
            )
            .some(
              category =>
                norm(category) ===
                norm(activeCategory)
            );


          return (
            queryMatch &&
            categoryMatch
          );

        }
      );


    switch (
      sortSelect.value
    ) {

      case "za":

        result.sort(
          (a, b) =>
            b.nome.localeCompare(
              a.nome,
              "pt-BR"
            )
        );

        break;


      case "category":

        result.sort(
          (a, b) => {

            const categoryA =
              a.servico ||
              a.categorias?.[0] ||
              "";

            const categoryB =
              b.servico ||
              b.categorias?.[0] ||
              "";


            return (
              categoryA.localeCompare(
                categoryB,
                "pt-BR"
              ) ||
              a.nome.localeCompare(
                b.nome,
                "pt-BR"
              )
            );

          }
        );

        break;


      case "recent":

        result.sort(
          (a, b) => {

            const dateA =
              Date.parse(
                a.dataCadastro
              ) || 0;

            const dateB =
              Date.parse(
                b.dataCadastro
              ) || 0;


            if (
              dateA === dateB
            ) {

              return (
                b.id -
                a.id
              );

            }


            return (
              dateB -
              dateA
            );

          }
        );

        break;


      default:

        result.sort(
          (a, b) =>
            a.nome.localeCompare(
              b.nome,
              "pt-BR"
            )
        );

    }


    return result;

  }

  /* ===========================================================

  function finishRefreshButton() {

    refreshBtn
      .classList
      .remove(
        "spinning"
      );


    refreshBtn.disabled =
      false;

  }


  function loadFromGoogleSheets(
    showSkeleton = false
  ) {

    if (
      showSkeleton &&
      empreendedores.length === 0
    ) {

      renderSkeletons();

    }


    errorMessage.style.display =
      "none";


    refreshBtn
      .classList
      .add(
        "spinning"
      );


    refreshBtn.disabled =
      true;


    const cacheBust =
      Date.now();


    const requestUrl =
      `${SHEET_CSV_URL}&cache=${cacheBust}`;


    Papa.parse(
      requestUrl,
      {

        download:
          true,

        header:
          true,

        skipEmptyLines:
          true,

        complete:
          results => {

            const parsed =
              parseRowsFromSheet(
                results.data
              );


            if (
              !parsed.length
            ) {

              handleSheetError(
                "A planilha foi carregada, mas não encontramos cadastros válidos."
              );

              return;

            }


            empreendedores =
              parsed;


            lastSuccessfulUpdate =
              Date.now();


            saveCache();


            /*
              Se uma categoria removida
              estava selecionada,
              volta para todas.
            */

            const categories =
              allCategories();


            if (
              activeCategory &&
              !categories.some(
                category =>
                  norm(category) ===
                  norm(activeCategory)
              )
            ) {

              activeCategory =
                "";

            }


            renderCategories();

            renderGrid();

            finishRefreshButton();

          },

        error:
          error => {

            console.error(
              error
            );


            handleSheetError(
              "Não conseguimos atualizar a planilha agora."
            );

          }

      }
    );

  }


  function handleSheetError(
    message
  ) {

    const hasCache =
      empreendedores.length > 0 ||
      loadCache();


    if (
      hasCache
    ) {

      renderCategories();

      renderGrid();


      errorMessage.textContent =
        `${message} Exibindo a última lista disponível.`;


      errorMessage.style.display =
        "block";

    }

    else {

      grid.innerHTML =
        `
          <div class="empty">
            Não foi possível carregar o catálogo no momento.
          </div>
        `;


      statusLine.textContent =
        "";


      errorMessage.textContent =
        `${message} Clique em Atualizar para tentar novamente.`;


      errorMessage.style.display =
        "block";

    }


    finishRefreshButton();

  }


  /* ===========================================================
     EVENTOS
  =========================================================== */

  searchInput.addEventListener(
    "input",
    renderGrid
  );


  sortSelect.addEventListener(
    "change",
    renderGrid
  );


  mobileCategory.addEventListener(
    "change",
    () => {

      activeCategory =
        mobileCategory.value;


      renderCategories();

      renderGrid();

    }
  );


  refreshBtn.addEventListener(
    "click",
    () => {

      loadFromGoogleSheets(
        false
      );

    }
  );


  /* ===========================================================
     INICIALIZAÇÃO
  =========================================================== */

  const cacheLoaded =
    loadCache();


  if (
    cacheLoaded
  ) {

    renderCategories();

    renderGrid();

  }

  else {

    renderSkeletons();

  }


  loadFromGoogleSheets(
    !cacheLoaded
  );


  /*
    Atualização automática:
    a cada 2 minutos.
  */

  setInterval(
    () => {

      loadFromGoogleSheets(
        false
      );

    },

    2 * 60 * 1000
  );

</script>

</body>
</html>
